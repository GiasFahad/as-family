const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const GREG_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const BANGLA_MONTHS = ["Boishakh","Jestha","Ashar","Shrabon","Bhadro","Ashwin","Kartik","Ogrohayon","Poush","Magh","Falgun","Choitro"];
const HIJRI_MONTHS = ["Muharram","Safar","Rabiul Awal","Rabius Sani","Jamadal Awal","Jamadas Sani","Rajab","Shaban","Ramadan","Shawwal","Zilqad","Zilhajj"];

function atMidnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function isGregLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

function weekNumberSunday(date) {
  const d = atMidnight(date);
  const start = new Date(d.getFullYear(), 0, 1);
  const diffDays = Math.round((d - start) / 86400000);
  return Math.ceil((diffDays + start.getDay() + 1) / 7);
}

function getBanglaDate(date) {
  const d = atMidnight(date);
  const y = d.getFullYear();
  const newYearThisYear = new Date(y, 3, 14);
  let bYear, startDate;
  if (d >= newYearThisYear) { bYear = y - 593; startDate = newYearThisYear; }
  else { bYear = y - 594; startDate = new Date(y - 1, 3, 14); }
  const dayOfYear = Math.round((d - startDate) / 86400000) + 1;
  const falgunDays = isGregLeap(startDate.getFullYear() + 1) ? 30 : 29;
  const monthLens = [31,31,31,31,31,31,30,30,30,30, falgunDays, 30];
  let remaining = dayOfYear, mIdx = 0;
  for (; mIdx < 12; mIdx++) {
    if (remaining <= monthLens[mIdx]) break;
    remaining -= monthLens[mIdx];
  }
  return { day: remaining, month: BANGLA_MONTHS[mIdx], year: bYear };
}

function getHijriDate(date) {
  try {
    const offset = globalSettings.hijriOffsetDays || 0;
    const shifted = new Date(date.getTime() + offset * 86400000);
    const fmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { day: "numeric", month: "numeric", year: "numeric" });
    const parts = fmt.formatToParts(shifted);
    const day = +parts.find(p => p.type === "day").value;
    const month = +parts.find(p => p.type === "month").value;
    const year = +parts.find(p => p.type === "year").value;
    return { day, month: HIJRI_MONTHS[month - 1], year };
  } catch { return null; }
}

function dateBarHtml() {
  const now = new Date();
  const parts = [];
  if (dispSettings.showWeekday) parts.push(WEEKDAYS[now.getDay()]);
  if (dispSettings.showWeek) parts.push(`WK-${weekNumberSunday(now)}`);
  if (dispSettings.showGregorian) parts.push(`${String(now.getDate()).padStart(2,"0")}-${GREG_MONTHS[now.getMonth()]}-${now.getFullYear()}`);
  if (dispSettings.showBangla) { const b = getBanglaDate(now); parts.push(`${b.day}-${b.month}-${b.year}`); }
  if (dispSettings.showHijri) { const h = getHijriDate(now); if (h) parts.push(`${h.day}-${h.month}-${h.year}`); }
  if (parts.length === 0) return "";
  return `<div class="mx-auto max-w-5xl px-4 pb-2 text-xs" style="color:#8a8578">${parts.map(esc).join(" &nbsp;│&nbsp; ")}</div>`;
}

let unsubDashEvents = null, unsubDashTenants = null, unsubDashRentPayments = null;

let unsubEventTypes = null, unsubEventPayments = null, unsubEventExpenses = null;

function startDashboardListeners() {
  if (unsubDashEvents) return;
  unsubDashEvents = onSnapshot(collection(db, "events"), (snap) => {
    dashEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "dashboard") paintDashboardCard();
    if (tab === "events") paintEventsTab();
  });
  unsubDashTenants = onSnapshot(collection(db, "tenants"), (snap) => {
    dashTenants = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "dashboard") paintDashboardCard();
    if (tab === "shopHouse") paintShopHouseTab();
  });
  unsubDashRentPayments = onSnapshot(collection(db, "rentPayments"), (snap) => {
    dashRentPayments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "dashboard") paintDashboardCard();
    if (tab === "shopHouse") paintShopHouseTab();
  });
  unsubExpenses = onSnapshot(collection(db, "expenses"), (snap) => {
    expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "shopHouse") paintShopHouseTab();
  });
  unsubExpenseCategories = onSnapshot(collection(db, "expenseCategories"), (snap) => {
    expenseCategories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "shopHouse") paintShopHouseTab();
  });
  unsubEventTypes = onSnapshot(collection(db, "eventTypes"), (snap) => {
    eventTypes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  });
  unsubEventPayments = onSnapshot(collection(db, "eventPayments"), (snap) => {
    eventPayments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "events") paintEventsTab();
    refreshOpenEventDetail();
  });
  unsubEventExpenses = onSnapshot(collection(db, "eventExpenses"), (snap) => {
    eventExpenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    refreshOpenEventDetail();
  });
}
function stopDashboardListeners() {
  if (unsubDashEvents) { unsubDashEvents(); unsubDashEvents = null; }
  if (unsubDashTenants) { unsubDashTenants(); unsubDashTenants = null; }
  if (unsubDashRentPayments) { unsubDashRentPayments(); unsubDashRentPayments = null; }
  if (unsubExpenses) { unsubExpenses(); unsubExpenses = null; }
  if (unsubExpenseCategories) { unsubExpenseCategories(); unsubExpenseCategories = null; }
  if (unsubEventTypes) { unsubEventTypes(); unsubEventTypes = null; }
  if (unsubEventPayments) { unsubEventPayments(); unsubEventPayments = null; }
  if (unsubEventExpenses) { unsubEventExpenses(); unsubEventExpenses = null; }
  dashEvents = []; dashTenants = []; dashRentPayments = []; expenses = []; expenseCategories = [];
  eventTypes = []; eventPayments = []; eventExpenses = [];
}

function computeDashboardStats() {
  const todayStr = new Date().toISOString().slice(0, 10);
  const pending = dashEvents.filter(e => e.status === "pending");
  const upcoming = pending.filter(e => e.eventDate >= todayStr).sort((a, b) => (a.eventDate > b.eventDate ? 1 : -1))[0];

  const now = new Date();
  const month = now.getMonth() + 1, year = now.getFullYear();
  const paidTenantIds = new Set(dashRentPayments.filter(p => p.month === month && p.year === year).map(p => p.tenantId));

  const subUnitById = Object.fromEntries(subUnits.map(s => [s.id, s]));
  let shopDue = 0, houseDue = 0;
  dashTenants.forEach(tn => {
    if (tn.active === false) return;
    if (paidTenantIds.has(tn.id)) return;
    const su = subUnitById[tn.subUnitId];
    const name = (su?.name || "").toLowerCase();
    if (name.includes("shop")) shopDue++;
    else if (name.includes("house")) houseDue++;
  });

  return { upcomingDate: upcoming ? upcoming.eventDate : null, pendingCount: pending.length, shopDue, houseDue };
}

let activeShopSub = null;

function shopHouseSubUnits() { return subUnits.filter(s => s.billingType !== "perEvent"); }

function periodLabel(su) {
  const now = new Date();
  if (su && su.billingType === "daily") return todayISO();
  if (su && su.billingType === "hourly") return todayISO();
  return `${now.getMonth() + 1}-${now.getFullYear()}`;
}
function tenantPaidThisPeriod(tenant) {
  const now = new Date();
  const month = now.getMonth() + 1, year = now.getFullYear();
  return dashRentPayments.some(p => p.tenantId === tenant.id && p.month === month && p.year === year);
}

function renderShopHouseTab(el, isAdmin) {
  const subs = shopHouseSubUnits();
  if (!activeShopSub && subs.length) activeShopSub = subs[0].id;

    </div>

  const su = subUnits.find(s => s.id === subUnitId);

function billingBadgeTone(bt) { return bt === "perEvent" ? "badge-gold" : "badge-green"; }

// Events module: per Sub Unit (billingType === perEvent) booking, payments,
// cancel/refund
// ---------------------------------------------------------------------------
let activeEventSub = null;
let openEventId = null;

function eventSubUnits() { return subUnits.filter(s => s.billingType === "perEvent"); }

function eventTotals(eventId) {
  const pays = eventPayments.filter(p => p.eventId === eventId);
  const paid = pays.filter(p => p.type !== "refund").reduce((s, p) => s + p.amount, 0);
  const refunded = pays.filter(p => p.type === "refund").reduce((s, p) => s + p.amount, 0);
  return { paid, refunded };
}

function nextMemoNo(subUnitId) {
  const su = subUnits.find(s => s.id === subUnitId);
  const u = units.find(x => x.id === su?.unitId);
  const prefix = (u?.name || "EVT").replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase() || "EV";
  const n = dashEvents.filter(e => e.subUnitId === subUnitId).length + 1;
  return `${prefix}-EVT-${String(n).padStart(4, "0")}`;
}

function renderEventsTab(el, isAdmin) {
  const subs = eventSubUnits();
  if (!activeEventSub && subs.length) activeEventSub = subs[0].id;
  el.innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-2 mb-5">
      <div class="flex flex-wrap gap-1.5">
        ${subs.map(s => `
          <button data-eventsub="${s.id}" class="tab-btn" style="border-radius:8px;background:${s.id === activeEventSub ? "#1B4332" : "#fff"};color:${s.id === activeEventSub ? "#fff" : "#6B6659"};border:1px solid #D8D2C2">
            ${esc(unitSubLabel(s.id))}

      </div>

function paintEventsTab() {
  const body = document.getElementById("eventsBody");
  if (!body) return;
  const list = dashEvents.filter(e => e.subUnitId === activeEventSub);
  body.innerHTML = list.map(e => {
    const { paid, refunded } = eventTotals(e.id);
    const balance = (e.totalRentAmount || 0) - paid + refunded;

    return `

async function adjustHijriOffset(delta) {
  const current = globalSettings.hijriOffsetDays || 0;
  const next = Math.max(-3, Math.min(3, current + delta));
  await setDoc(doc(db, "settings", "global"), { hijriOffsetDays: next }, { merge: true });
}

function openModal(title, bodyHtml, onMount) {

      </div>
      <div class="p-5">${bodyHtml}</div>

  document.body.appendChild(wrap);

  onMount(wrap);
  return wrap;

function permMatrixHtml(existingPerms) {
  const perms = existingPerms || {};
  if (units.length === 0) return `<p class="text-xs" style="color:#8a8578">—</p>`;
  return units.map(u => `
    <div class="mb-2">
      <div class="text-xs font-semibold mb-1" style="color:#1B4332">${esc(u.name)}</div>
      <div class="flex flex-col gap-1">
        ${subUnits.filter(s => s.unitId === u.id).map(s => {
          const p = perms[s.id] || {};
          return `
          <div class="flex items-center justify-between text-sm rounded-lg px-3 py-1.5 gap-2" style="background:#F7F5F0">
            <span class="shrink-0">${esc(s.name)}</span>
            <div class="flex items-center gap-3 text-xs">
              <label class="flex items-center gap-1"><input type="checkbox" data-permsub="${s.id}" data-permflag="view" ${p.view ? "checked" : ""} />${t().viewOnly}</label>
              <label class="flex items-center gap-1"><input type="checkbox" data-permsub="${s.id}" data-permflag="add" ${p.add ? "checked" : ""} />${t().dataAdd}</label>
              <label class="flex items-center gap-1"><input type="checkbox" data-permsub="${s.id}" data-permflag="edit" ${p.edit ? "checked" : ""} />${t().dataEdit}</label>
            </div>
          </div>`;
        }).join("") || `<p class="text-xs" style="color:#8a8578">—</p>`}
      </div>
    </div>`).join("");
}
function readPermMatrix(wrap) {
  const out = {};
  wrap.querySelectorAll("[data-permsub]").forEach(cb => {
    const subId = cb.getAttribute("data-permsub");
    const flag = cb.getAttribute("data-permflag");
    if (!out[subId]) out[subId] = { view: false, add: false, edit: false };
    out[subId][flag] = cb.checked;
  });
  // drop subunits with no flags checked at all (= No Access)
  Object.keys(out).forEach(k => { if (!out[k].view && !out[k].add && !out[k].edit) delete out[k]; });
  return out;
}

        errBox.textContent = t().userCreateError;

  const snap = await getDocs(collection(db, "units"));
  if (!snap.empty) return;
  const unitRef = await addDoc(collection(db, "units"), { name: "Green Park", createdAt: serverTimestamp() });
  for (const s of [{ name: "Event", billingType: "perEvent" }, { name: "Shop", billingType: "monthly" }, { name: "House", billingType: "monthly" }]) {

  }

function startUnitsListeners(isAdmin) {
  if (unsubUnits) return;
  unsubUnits = onSnapshot(collection(db, "units"), (snap) => {
    units = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "adminPanel") paintAdminGrid();
  });
  unsubSubUnits = onSnapshot(collection(db, "subUnits"), (snap) => {
    subUnits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "adminPanel") paintAdminGrid();
  });
  unsubGlobalSettings = onSnapshot(doc(db, "settings", "global"), (snap) => {
    globalSettings = { hijriOffsetDays: 0, ...(snap.exists() ? snap.data() : {}) };
    const bar = document.getElementById("dateBar");
    if (bar) bar.innerHTML = dateBarHtml();
    if (tab === "adminPanel") paintAdminGrid();
  });
  startDashboardListeners();
  if (isAdmin) seedIfEmpty();
}

function stopUnitsListeners() {
  if (unsubUnits) { unsubUnits(); unsubUnits = null; }
  if (unsubSubUnits) { unsubSubUnits(); unsubSubUnits = null; }
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  if (unsubGlobalSettings) { unsubGlobalSettings(); unsubGlobalSettings = null; }
  stopDashboardListeners();
  units = []; subUnits = []; allUsers = []; globalSettings = { hijriOffsetDays: 0 };
}

onAuthStateChanged(auth, async (u) => {
  authChecked = true;
  currentUser = u || null;
  if (!u) { profile = null; profileChecked = true; stopUnitsListeners(); render(); return; }
  profileChecked = false; render();
  const snap = await getDoc(doc(db, "users", u.uid));
  profile = snap.exists() ? snap.data() : null;
  profileChecked = true;
  render();
  if (profile) startUnitsListeners(profile.role === "admin");
});

setInterval(() => {
  const bar = document.getElementById("dateBar");
  if (bar) bar.innerHTML = dateBarHtml();
}, 30000);
