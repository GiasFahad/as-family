const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const GREG_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const BANGLA_MONTHS = ["Boishakh","Jestha","Ashar","Shrabon","Bhadro","Ashwin","Kartik","Ogrohayon","Poush","Magh","Falgun","Choitro"];
const HIJRI_MONTHS = ["Muharram","Safar","Rabiul Awal","Rabius Sani","Jamadal Awal","Jamadas Sani","Rajab","Shaban","Ramadan","Shawwal","Zilqad","Zilhajj"];

function atMidnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function isGregLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

function weekNumberSunday(date) {
  const d = atMidnight(date);
  const start = new Date(d.getFullYear(), 0, 1);
  const diffDays = Math.round((d - start) / 86400000);
  return Math.ceil((diffDays + start.getDay() + 1) / 7);
}

function getBanglaDate(date) {
  const d = atMidnight(date);
  const y = d.getFullYear();
  const newYearThisYear = new Date(y, 3, 14);
  let bYear, startDate;
  if (d >= newYearThisYear) { bYear = y - 593; startDate = newYearThisYear; }
  else { bYear = y - 594; startDate = new Date(y - 1, 3, 14); }
  const dayOfYear = Math.round((d - startDate) / 86400000) + 1;
  const falgunDays = isGregLeap(startDate.getFullYear() + 1) ? 30 : 29;
  const monthLens = [31,31,31,31,31,31,30,30,30,30, falgunDays, 30];
  let remaining = dayOfYear, mIdx = 0;
  for (; mIdx < 12; mIdx++) {
    if (remaining <= monthLens[mIdx]) break;
    remaining -= monthLens[mIdx];
  }
  return { day: remaining, month: BANGLA_MONTHS[mIdx], year: bYear };
}

function getHijriDate(date) {
  try {
    const fmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { day: "numeric", month: "numeric", year: "numeric" });
    const parts = fmt.formatToParts(date);
    const day = +parts.find(p => p.type === "day").value;
    const month = +parts.find(p => p.type === "month").value;
    const year = +parts.find(p => p.type === "year").value;
    return { day, month: HIJRI_MONTHS[month - 1], year };
  } catch { return null; }
}

function dateBarHtml() {
  const now = new Date();
  const parts = [];
  if (dispSettings.showWeekday) parts.push(WEEKDAYS[now.getDay()]);
  if (dispSettings.showWeek) parts.push(`WK-${weekNumberSunday(now)}`);
  if (dispSettings.showGregorian) parts.push(`${String(now.getDate()).padStart(2,"0")}-${GREG_MONTHS[now.getMonth()]}-${now.getFullYear()}`);
  if (dispSettings.showBangla) { const b = getBanglaDate(now); parts.push(`${b.day}-${b.month}-${b.year}`); }
  if (dispSettings.showHijri) { const h = getHijriDate(now); if (h) parts.push(`${h.day}-${h.month}-${h.year}`); }
  if (parts.length === 0) return "";
  return `<div class="mx-auto max-w-5xl px-4 pb-2 text-xs" style="color:#8a8578">${parts.map(esc).join(" &nbsp;│&nbsp; ")}</div>`;
}

function renderLogin() {
  root.innerHTML = `
  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="card p-6 w-full max-w-sm">
      <div class="text-center mb-6">

      </div>
      <form id="loginForm" class="flex flex-col gap-4">
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium" style="color:#6B6659">${t().email}</span>
          <input type="email" required id="loginEmail" class="inp" />
        </label>
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium" style="color:#6B6659">${t().password}</span>
          <input type="password" required id="loginPassword" class="inp" />
        </label>
        <div id="loginErr" class="text-xs" style="color:#9B2C2C"></div>
        <button type="submit" class="btn btn-primary justify-center" id="loginBtn">${t().login}</button>
      </form>
    </div>
  </div>`;
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const errBox = document.getElementById("loginErr");
    errBox.textContent = "";
    btn.textContent = t().loading;
    try {
      await signInWithEmailAndPassword(auth,
        document.getElementById("loginEmail").value.trim(),
        document.getElementById("loginPassword").value);
    } catch (e) {
      errBox.textContent = t().loginError;
      btn.textContent = t().login;
    }
  });
}

      <div class="p-5">${bodyHtml}</div>

function permMatrixHtml(existingPerms) {
  const perms = existingPerms || {};
  if (units.length === 0) return `<p class="text-xs" style="color:#8a8578">—</p>`;
  return units.map(u => `
    <div class="mb-2">
      <div class="text-xs font-semibold mb-1" style="color:#1B4332">${esc(u.name)}</div>
      <div class="flex flex-col gap-1">
        ${subUnits.filter(s => s.unitId === u.id).map(s => `
          <div class="flex items-center justify-between text-sm rounded-lg px-3 py-1.5" style="background:#F7F5F0">
            <span>${esc(s.name)}</span>
            <select data-permsub="${s.id}" class="inp" style="width:auto;padding:4px 8px;font-size:12px">
              ${PERM_LEVELS.map(lv => `<option value="${lv}" ${((perms[s.id] || "none") === lv) ? "selected" : ""}>${permLabel(lv)}</option>`).join("")}
            </select>
          </div>`).join("") || `<p class="text-xs" style="color:#8a8578">—</p>`}
      </div>
    </div>`).join("");
}
function readPermMatrix(wrap) {
  const out = {};
  wrap.querySelectorAll("[data-permsub]").forEach(sel => {
    const lv = sel.value;
    if (lv !== "none") out[sel.getAttribute("data-permsub")] = lv;
  });
  return out;
}

  openModal(t().addUser, `

      </label>
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" id="uIsAdmin" />
        <span>${t().isAdminUser}</span>
      </label>
      <div id="uPermsWrap">
        <div class="text-sm font-medium mb-2" style="color:#6B6659">${t().permissions}</div>
        <div id="uPerms">${permMatrixHtml({})}</div>
      </div>
      <div id="uErr" class="text-xs" style="color:#9B2C2C"></div>
      <div class="flex justify-end gap-2">
        <button id="cancelBtn" class="btn btn-outline">${t().cancel}</button>
        <button id="saveBtn" class="btn btn-primary">${t().save}</button>
      </div>
    </div>`, (wrap) => {
    wrap.querySelector("#uIsAdmin").addEventListener("change", (e) => {
      wrap.querySelector("#uPermsWrap").style.display = e.target.checked ? "none" : "block";
    });
    wrap.querySelector("#cancelBtn").addEventListener("click", () => wrap.remove());
    wrap.querySelector("#saveBtn").addEventListener("click", async () => {
      const name = wrap.querySelector("#uName").value.trim();
      const email = wrap.querySelector("#uEmail").value.trim();
      const password = wrap.querySelector("#uPassword").value;
      const isAdminUser = wrap.querySelector("#uIsAdmin").checked;
      const errBox = wrap.querySelector("#uErr");
      if (!name || !email || password.length < 6) { errBox.textContent = t().userCreateError; return; }
      const permissions = isAdminUser ? {} : readPermMatrix(wrap);
      const secName = "secondary-" + Date.now();
      try {
        const secApp = initializeApp(firebaseConfig, secName);
        const secAuth = getAuth(secApp);
        const cred = await createUserWithEmailAndPassword(secAuth, email, password);
        const newUid = cred.user.uid;
        await signOut(secAuth);
        await deleteApp(secApp);
        await setDoc(doc(db, "users", newUid), {
          name, email, role: isAdminUser ? "admin" : "user", active: true, permissions, createdAt: serverTimestamp(),
        });
        wrap.remove();
      } catch (e) {
        errBox.textContent = t().userCreateError;
      }
    });
  });
}

      <label class="flex flex-col gap-1 text-sm">
        <span class="font-medium" style="color:#6B6659">${t().billingType}</span>
        <select id="subBillingInput" class="inp">${billingOptionsHtml(sub.billingType)}</select>
      </label>
      <div class="flex justify-end gap-2">
        <button id="cancelBtn" class="btn btn-outline">${t().cancel}</button>
        <button id="saveBtn" class="btn btn-primary">${t().save}</button>
      </div>
    </div>`, (wrap) => {
    wrap.querySelector("#cancelBtn").addEventListener("click", () => wrap.remove());
    wrap.querySelector("#saveBtn").addEventListener("click", async () => {
      const name = wrap.querySelector("#subNameInput").value.trim();
      const billingType = wrap.querySelector("#subBillingInput").value;
      if (!name) return;
      await updateDoc(doc(db, "subUnits", sub.id), { name, billingType });
      wrap.remove();
    });
  });
}

async function seedIfEmpty() {
  const snap = await getDocs(collection(db, "units"));
  if (!snap.empty) return;
  const unitRef = await addDoc(collection(db, "units"), { name: "Green Park", createdAt: serverTimestamp() });
  for (const s of [{ name: "Event", billingType: "perEvent" }, { name: "Shop", billingType: "monthly" }, { name: "House", billingType: "monthly" }]) {
    await addDoc(collection(db, "subUnits"), { unitId: unitRef.id, name: s.name, billingType: s.billingType, createdAt: serverTimestamp() });
  }
}

function startUnitsListeners(isAdmin) {
  if (unsubUnits) return;
  unsubUnits = onSnapshot(collection(db, "units"), (snap) => {
    units = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "adminPanel") paintAdminGrid();
  });
  unsubSubUnits = onSnapshot(collection(db, "subUnits"), (snap) => {
    subUnits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "adminPanel") paintAdminGrid();
  });
  if (isAdmin) seedIfEmpty();
}

function stopUnitsListeners() {
  if (unsubUnits) { unsubUnits(); unsubUnits = null; }
  if (unsubSubUnits) { unsubSubUnits(); unsubSubUnits = null; }
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  units = []; subUnits = []; allUsers = [];
}

onAuthStateChanged(auth, async (u) => {
  authChecked = true;
  currentUser = u || null;
  if (!u) { profile = null; profileChecked = true; stopUnitsListeners(); render(); return; }
  profileChecked = false; render();
  const snap = await getDoc(doc(db, "users", u.uid));
  profile = snap.exists() ? snap.data() : null;
  profileChecked = true;
  render();
  if (profile) startUnitsListeners(profile.role === "admin");
});

setInterval(() => {
  const bar = document.getElementById("dateBar");
  if (bar) bar.innerHTML = dateBarHtml();
}, 30000);
</script>
</body>
</html>
