const SETTINGS_KEY = "asfb_settings";
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    const s = raw ? JSON.parse(raw) : {};
    return { showWeekday: true, showWeek: true, showGregorian: true, showBangla: true, showHijri: true, ...s };
  } catch { return { showWeekday: true, showWeek: true, showGregorian: true, showBangla: true, showHijri: true }; }
}
function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

const HIJRI_MONTHS = ["Muharram","Safar","Rabiul Awal","Rabius Sani","Jamadal Awal","Jamadas Sani","Rajab","Shaban","Ramadan","Shawwal","Zilqad","Zilhajj"];

function isGregLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function weekNumberSunday(date) {
  const d = atMidnight(date);
  const start = new Date(d.getFullYear(), 0, 1);
  const diffDays = Math.round((d - start) / 86400000);
  return Math.ceil((diffDays + start.getDay() + 1) / 7);
}
function getBanglaDate(date) {
  const d = atMidnight(date);
  const y = d.getFullYear();
  const newYearThisYear = new Date(y, 3, 14);
  let bYear, startDate;
  if (d >= newYearThisYear) { bYear = y - 593; startDate = newYearThisYear; }
  else { bYear = y - 594; startDate = new Date(y - 1, 3, 14); }
  const dayOfYear = Math.round((d - startDate) / 86400000) + 1;
  const falgunDays = isGregLeap(startDate.getFullYear() + 1) ? 30 : 29;
  const monthLens = [31,31,31,31,31,31,30,30,30,30, falgunDays, 30];
  let remaining = dayOfYear, mIdx = 0;
  for (; mIdx < 12; mIdx++) {
    if (remaining <= monthLens[mIdx]) break;
    remaining -= monthLens[mIdx];
  }
  return { day: remaining, month: BANGLA_MONTHS[mIdx], year: bYear };
}
function getHijriDate(date) {
  try {
    const offset = globalSettings.hijriOffsetDays || 0;
    const shifted = new Date(date.getTime() + offset * 86400000);
    const fmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { day: "numeric", month: "numeric", year: "numeric" });
    const parts = fmt.formatToParts(shifted);
    const day = +parts.find(p => p.type === "day").value;
    const month = +parts.find(p => p.type === "month").value;
    const year = +parts.find(p => p.type === "year").value;
    return { day, month: HIJRI_MONTHS[month - 1], year };
  } catch { return null; }
}
function dateBarHtml() {
  const now = new Date();
  const parts = [];
  if (dispSettings.showWeekday) parts.push(WEEKDAYS[now.getDay()]);
  if (dispSettings.showWeek) parts.push(`WK-${weekNumberSunday(now)}`);
  if (dispSettings.showGregorian) parts.push(`${String(now.getDate()).padStart(2,"0")}-${GREG_MONTHS[now.getMonth()]}-${now.getFullYear()}`);
  if (dispSettings.showBangla) { const b = getBanglaDate(now); parts.push(`${b.day}-${b.month}-${b.year}`); }
  if (dispSettings.showHijri) { const h = getHijriDate(now); if (h) parts.push(`${h.day}-${h.month}-${h.year}`); }
  if (parts.length === 0) return "";
  return `<div class="mx-auto max-w-5xl px-4 pb-2 text-xs" style="color:#8a8578">${parts.map(esc).join(" &nbsp;│&nbsp; ")}</div>`;
}

function isAdmin() { return !!(profile && profile.role === "admin"); }
function permFor(subUnitId) {
  if (isAdmin()) return { view: true, add: true, edit: true };
  const p = (profile && profile.permissions && profile.permissions[subUnitId]) || {};
  return { view: !!p.view, add: !!p.add, edit: !!p.edit };
}
function canView(subUnitId) { const p = permFor(subUnitId); return p.view || p.add || p.edit; }
function canAdd(subUnitId) { return permFor(subUnitId).add; }
function canEdit(subUnitId) { return permFor(subUnitId).edit; }
function accessibleUnits() {
  if (isAdmin()) return units;
  const okSubUnitIds = new Set(subUnits.filter(s => canView(s.id)).map(s => s.id));
  return units.filter(u => subUnits.some(s => s.unitId === u.id && okSubUnitIds.has(s.id)));
}
function accessibleSubUnitsOf(unitId) {
  const list = subUnits.filter(s => s.unitId === unitId);
  return isAdmin() ? list : list.filter(s => canView(s.id));
}

function eventBalance(ev) {
  const pays = eventPayments.filter(p => p.eventId === ev.id);
  const paid = pays.filter(p => p.type !== "refund").reduce((s, p) => s + p.amount, 0);
  const refunded = pays.filter(p => p.type === "refund").reduce((s, p) => s + p.amount, 0);
  return (ev.totalRentAmount || 0) - paid + refunded;
}
function eventPriority(ev) {
  if (ev.status === "cancelled") return 2;
  return eventBalance(ev) > 0 ? 0 : 1;
}
function sortedEvents(list) {
  return [...list].sort((a, b) => {
    const pa = eventPriority(a), pb = eventPriority(b);
    if (pa !== pb) return pa - pb;
    return (a.eventDate || "") < (b.eventDate || "") ? -1 : 1;
  });
}

function computeDashboardStats() {
  const todayStr = todayISO();
  const pending = events.filter(e => e.status !== "cancelled" && eventBalance(e) > 0);
  const upcoming = pending.filter(e => e.eventDate >= todayStr).sort((a, b) => (a.eventDate > b.eventDate ? 1 : -1))[0];
  const now = new Date();
  const month = now.getMonth() + 1, year = now.getFullYear();
  const paidTenantIds = new Set(rentPayments.filter(p => p.month === month && p.year === year).map(p => p.tenantId));
  const subUnitById = Object.fromEntries(subUnits.map(s => [s.id, s]));
  let shopDue = 0, houseDue = 0;
  tenants.forEach(tn => {
    if (tn.active === false || paidTenantIds.has(tn.id)) return;
    const name = (subUnitById[tn.subUnitId]?.name || "").toLowerCase();
    if (name.includes("shop")) shopDue++;
    else if (name.includes("house")) houseDue++;
  });
  return { upcomingDate: upcoming ? upcoming.eventDate : null, pendingCount: pending.length, shopDue, houseDue };
}

function nextMemoSuggestion(subUnitId) {
  const su = subUnits.find(s => s.id === subUnitId);
  const u = units.find(x => x.id === su?.unitId);
  const prefix = (u?.name || "EVT").replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase() || "EV";
  const n = events.filter(e => e.subUnitId === subUnitId).length + 1;
  return `${prefix}-EVT-${String(n).padStart(4, "0")}`;
}
function memoTaken(subUnitId, memoNo, excludeId) {
  return events.some(e => e.subUnitId === subUnitId && e.id !== excludeId && (e.memoNo || "").toLowerCase() === memoNo.toLowerCase());
}

        <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().boyQty}</span><input id="evBoy" type="number" class="inp" value="${existing?.boyQty ?? ""}" /></label>
      </div>
      <div class="flex justify-end gap-2">
        <button id="cancelBtn" class="btn btn-outline">${t().cancel}</button>
        <button id="saveBtn" class="btn btn-primary">${t().save}</button>
      </div>
    </div>`, (wrap) => {
    function bindChips() {
      wrap.querySelectorAll("[data-etype]").forEach(b => b.addEventListener("click", () => {
        const id = b.getAttribute("data-etype");
        selected = selected.includes(id) ? selected.filter(x => x !== id) : [...selected, id];
        wrap.querySelector("#etypeWrap").innerHTML = eventTypeChipsHtml(selected);
        bindChips();
      }));
    }
    bindChips();
    wrap.querySelector("#cancelBtn").addEventListener("click", () => wrap.remove());
    wrap.querySelector("#evMemo").addEventListener("input", (e) => {
      const warn = wrap.querySelector("#memoWarn");
      if (memoTaken(subUnitId, e.target.value.trim(), existing?.id)) { warn.textContent = t().duplicateMemo; markInvalid(e.target); }
      else { warn.textContent = ""; clearInvalid(e.target); }
    });
    wrap.querySelector("#saveBtn").addEventListener("click", async () => {
      const fields = {
        evMemo: wrap.querySelector("#evMemo"), evName: wrap.querySelector("#evName"),
        evAddress: wrap.querySelector("#evAddress"), evBooking: wrap.querySelector("#evBooking"),
        evDate: wrap.querySelector("#evDate"), evTime: wrap.querySelector("#evTime"),
        evTotal: wrap.querySelector("#evTotal"), evTable: wrap.querySelector("#evTable"), evBoy: wrap.querySelector("#evBoy"),
      };
      let ok = true;
      Object.values(fields).forEach(f => {
        if (!f.value || !f.value.toString().trim()) { markInvalid(f); ok = false; } else clearInvalid(f);
      });
      const memoVal = fields.evMemo.value.trim();
      if (memoTaken(subUnitId, memoVal, existing?.id)) { markInvalid(fields.evMemo); ok = false; }
      if (!selected.length) ok = false;
      if (!ok) { wrap.querySelector("#memoWarn").textContent = t().fillAllFields; return; }

      const data = {
        memoNo: memoVal, customerName: fields.evName.value.trim(), customerAddress: fields.evAddress.value.trim(),
        eventTypeIds: selected, bookingDate: fields.evBooking.value, eventDate: fields.evDate.value, eventTime: fields.evTime.value,
        totalRentAmount: Number(fields.evTotal.value) || 0, tableQty: Number(fields.evTable.value) || 0, boyQty: Number(fields.evBoy.value) || 0,
      };
      if (isEdit) {
        await performEdit("events", existing.id, data, subUnitId);
      } else {
        await addDoc(collection(db, "events"), { subUnitId, status: "pending", createdAt: serverTimestamp(), ...data });
      }
      wrap.remove();
    });
  });
}

  box.closest(".modal-box").querySelector("h3").textContent = `${e.customerName} — ${e.memoNo}`;

  box.innerHTML = `

      <div><span style="color:#8a8578">${t().totalRent}: </span>৳${Number(e.totalRentAmount || 0).toLocaleString()}</div>
      <div><span style="color:#8a8578">${t().collected}: </span>৳${paid.toLocaleString()}</div>
      ${refunded > 0 ? `<div class="col-span-2"><span style="color:#8a8578">${t().refund}: </span>-৳${refunded.toLocaleString()}</div>` : ""}
      <div class="col-span-2 text-base font-semibold" style="color:#1B4332">${t().balance}: ৳${Math.max(balance, 0).toLocaleString()}</div>
    </div>
    ${e.status !== "cancelled" ? `
    <div class="flex flex-wrap gap-2 mb-4">
      ${edit ? `<button id="btnEditEvent" class="btn btn-outline" style="padding:6px 10px;font-size:12px">${icons.pencil}${t().edit}</button>` : ""}
      ${add ? `<button id="btnAdvance" class="btn btn-gold" style="padding:6px 10px;font-size:12px">${icons.plus}${t().advance}</button>` : ""}
      ${add ? `<button id="btnDue" class="btn btn-gold" style="padding:6px 10px;font-size:12px">${icons.plus}${t().dueCollection}</button>` : ""}
      ${add ? `<button id="btnExp" class="btn btn-outline" style="padding:6px 10px;font-size:12px">${icons.plus}${t().eventExpenseHistory}</button>` : ""}
      ${add && paid - refunded > 0 ? `<button id="btnRefund" class="btn btn-outline" style="padding:6px 10px;font-size:12px">${t().refund}</button>` : ""}
      ${add ? `<button id="btnCancelEvent" class="btn btn-danger" style="padding:6px 10px;font-size:12px">${t().cancelEvent}</button>` : ""}
    </div>` : (add && paid - refunded > 0 ? `<button id="btnRefund" class="btn btn-outline mb-4" style="padding:6px 10px;font-size:12px">${t().refund}</button>` : "")}
    ${e.status === "cancelled" && e.cancelReason ? `<p class="text-xs mb-3" style="color:#8a8578">${t().cancelReason}: ${esc(e.cancelReason)}</p>` : ""}
    <div class="mb-4">
      <h4 class="text-sm font-semibold mb-2" style="color:#1B4332">${t().payHistory}</h4>
      ${pays.length ? `<ul class="flex flex-col gap-1.5">${pays.map(p => `
        <li class="flex items-center justify-between rounded-lg px-3 py-1.5 text-xs" style="background:#F7F5F0">
          <span>${p.type === "advance" ? t().advance : p.type === "due" ? t().dueCollection : t().refund} · ${esc(p.paidDate || "")}</span>
          <span style="${p.type === "refund" ? "color:#9B2C2C;font-weight:600" : "font-weight:600"}">${p.type === "refund" ? "-" : ""}৳${Number(p.amount).toLocaleString()}</span>
        </li>`).join("")}</ul>` : `<p class="text-xs" style="color:#8a8578">${t().noData}</p>`}
    </div>
    ${exps.length ? `<div>
      <h4 class="text-sm font-semibold mb-2" style="color:#1B4332">${t().eventExpenseHistory}</h4>
      <ul class="flex flex-col gap-1.5">${exps.map(x => `
        <li class="flex items-center justify-between rounded-lg px-3 py-1.5 text-xs" style="background:#F7F5F0">
          <span>${x.type === "boyWage" ? t().boyWage : x.type === "labourWage" ? t().labourWage : t().otherExpense} ${x.details ? "· " + esc(x.details) : ""}</span>

        </li>`).join("")}</ul>

  const be = box.querySelector("#btnEditEvent"); if (be) be.addEventListener("click", () => openBookEventModal(e.subUnitId, e));

        <button data-addcat="${su.id}" class="btn btn-ghost" style="padding:4px 8px;font-size:12px">${icons.plus}${t().addCategory}</button>
      </div>
      <div class="flex flex-wrap gap-1.5">
        ${expenseCategories.filter(c => c.subUnitId === su.id).map(c => `
          <span class="badge badge-green" style="display:inline-flex;align-items:center;gap:6px">
            ${esc(c.name)}
            <button data-editcat="${c.id}" style="color:#1B4332">${icons.pencil}</button>
            <button data-delcat="${c.id}" style="color:#9B2C2C">${icons.trash}</button>
          </span>`).join("") || `<span class="text-xs" style="color:#8a8578">—</span>`}
      </div>
    </div>`).join("") || `<p class="text-xs" style="color:#8a8578">${t().noData}</p>`;
  grid.querySelectorAll("[data-addcat]").forEach(b => b.addEventListener("click", () => openCategoryModal(b.getAttribute("data-addcat"))));
  grid.querySelectorAll("[data-editcat]").forEach(b => b.addEventListener("click", () => {
    const cat = expenseCategories.find(c => c.id === b.getAttribute("data-editcat"));
    openCategoryModal(cat.subUnitId, cat);
  }));
  grid.querySelectorAll("[data-delcat]").forEach(b => b.addEventListener("click", () => {
    withPasswordConfirm(async () => { await deleteDoc(doc(db, "expenseCategories", b.getAttribute("data-delcat"))); });
  }));
}
function openCategoryModal(subUnitId, existing) {
  openModal(existing ? t().edit : t().addCategory, `
    <div class="flex flex-col gap-4">
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().newCategoryName}</span><input id="catName" class="inp" value="${esc(existing?.name || "")}" /></label>
      <div class="flex justify-end gap-2"><button id="cancelBtn" class="btn btn-outline">${t().cancel}</button><button id="saveBtn" class="btn btn-primary">${t().save}</button></div>
    </div>`, (wrap) => {
    wrap.querySelector("#cancelBtn").addEventListener("click", () => wrap.remove());
    wrap.querySelector("#saveBtn").addEventListener("click", () => {
      const name = wrap.querySelector("#catName").value.trim();
      if (!name) return;
      wrap.remove();
      if (existing) {
        withPasswordConfirm(async () => { await updateDoc(doc(db, "expenseCategories", existing.id), { name }); });
      } else {
        addDoc(collection(db, "expenseCategories"), { subUnitId, name, createdAt: serverTimestamp() });
      }
    });
  });
}

function paintEventTypeGrid() {
  const grid = document.getElementById("etGrid");
  if (!grid) return;
  grid.innerHTML = eventTypes.map(et => `
    <span class="badge badge-gold" style="display:inline-flex;align-items:center;gap:6px">
      ${esc(et.name)}
      <button data-editet="${et.id}" style="color:#8a6a3f">${icons.pencil}</button>

  grid.querySelectorAll("[data-delet]").forEach(b => b.addEventListener("click", () => {
    withPasswordConfirm(async () => { await deleteDoc(doc(db, "eventTypes", b.getAttribute("data-delet"))); });
  }));
}
function openEventTypeModal(existing) {
  openModal(existing ? t().edit : t().addType, `
    <div class="flex flex-col gap-4">
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().eventType}</span><input id="etName" class="inp" value="${esc(existing?.name || "")}" /></label>
      <div class="flex justify-end gap-2"><button id="cancelBtn" class="btn btn-outline">${t().cancel}</button><button id="saveBtn" class="btn btn-primary">${t().save}</button></div>
    </div>`, (wrap) => {
    wrap.querySelector("#cancelBtn").addEventListener("click", () => wrap.remove());
    wrap.querySelector("#saveBtn").addEventListener("click", () => {
      const name = wrap.querySelector("#etName").value.trim();
      if (!name) return;
      wrap.remove();
      if (existing) {
        withPasswordConfirm(async () => { await updateDoc(doc(db, "eventTypes", existing.id), { name }); });

        addDoc(collection(db, "eventTypes"), { name, createdAt: serverTimestamp() });

function targetLabel(req) {
  if (req.targetCollection === "tenants") { const tn = tenants.find(x => x.id === req.targetId); return tn ? tn.name : req.targetId; }
  if (req.targetCollection === "events") { const ev = events.find(x => x.id === req.targetId); return ev ? `${ev.customerName} (${ev.memoNo})` : req.targetId; }
  return req.targetId;
}
function paintApprovalList() {
  const box = document.getElementById("approvalList");
  if (!box) return;
  const pending = approvalRequests.filter(r => r.status === "pending");
  box.innerHTML = pending.map(r => `
    <div class="card p-3">
      <div class="flex items-center justify-between mb-1">
        <div class="text-sm font-medium" style="color:#1B4332">${esc(targetLabel(r))}</div>
        <span class="text-xs" style="color:#8a8578">${t().requestedBy}: ${esc(r.requestedByName || "")}</span>
      </div>
      <div class="text-xs mb-2" style="color:#6B6659">${t().changes}: ${Object.entries(r.changes || {}).map(([k,v]) => `${esc(k)}: ${esc(Array.isArray(v) ? v.join(",") : v)}`).join(" · ")}</div>
      <div class="flex gap-2">
        <button data-approve="${r.id}" class="btn btn-primary" style="padding:4px 10px;font-size:12px">${icons.check}${t().approve}</button>
        <button data-reject="${r.id}" class="btn btn-outline" style="padding:4px 10px;font-size:12px">${t().reject}</button>
      </div>
    </div>`).join("") || `<p class="text-xs" style="color:#8a8578">${t().noRequests}</p>`;
  box.querySelectorAll("[data-approve]").forEach(b => b.addEventListener("click", async () => {
    const r = approvalRequests.find(x => x.id === b.getAttribute("data-approve"));
    if (!r) return;
    await updateDoc(doc(db, r.targetCollection, r.targetId), r.changes);
    await updateDoc(doc(db, "approvalRequests", r.id), { status: "approved" });
  }));
  box.querySelectorAll("[data-reject]").forEach(b => b.addEventListener("click", async () => {
    await updateDoc(doc(db, "approvalRequests", b.getAttribute("data-reject")), { status: "rejected" });
  }));
}

function permMatrixHtml(existingPerms) {
  const perms = existingPerms || {};
  if (units.length === 0) return `<p class="text-xs" style="color:#8a8578">—</p>`;
  return units.map(u => `
    <div class="mb-2">
      <div class="text-xs font-semibold mb-1" style="color:#1B4332">${esc(u.name)}</div>
      <div class="flex flex-col gap-1">
        ${subUnits.filter(s => s.unitId === u.id).map(s => {
          const p = perms[s.id] || {};
          return `
          <div class="flex items-center justify-between text-sm rounded-lg px-3 py-1.5 gap-2" style="background:#F7F5F0">
            <span class="shrink-0">${esc(s.name)}</span>
            <div class="flex items-center gap-3 text-xs">
              <label class="flex items-center gap-1"><input type="checkbox" data-permsub="${s.id}" data-permflag="view" ${p.view ? "checked" : ""} />${t().viewOnly}</label>
              <label class="flex items-center gap-1"><input type="checkbox" data-permsub="${s.id}" data-permflag="add" ${p.add ? "checked" : ""} />${t().dataAdd}</label>
              <label class="flex items-center gap-1"><input type="checkbox" data-permsub="${s.id}" data-permflag="edit" ${p.edit ? "checked" : ""} />${t().dataEdit}</label>
            </div>
          </div>`;
        }).join("") || `<p class="text-xs" style="color:#8a8578">—</p>`}
      </div>
    </div>`).join("");
}
function readPermMatrix(wrap) {
  const out = {};
  wrap.querySelectorAll("[data-permsub]").forEach(cb => {
    const subId = cb.getAttribute("data-permsub");
    const flag = cb.getAttribute("data-permflag");
    if (!out[subId]) out[subId] = { view: false, add: false, edit: false };
    out[subId][flag] = cb.checked;
  });
  Object.keys(out).forEach(k => { if (!out[k].view && !out[k].add && !out[k].edit) delete out[k]; });
  return out;
}

function paintUsersList() {
  const listEl = document.getElementById("usersList");
  if (!listEl) return;
  listEl.innerHTML = allUsers.map(u => `
    <div class="card p-3 flex items-center justify-between">
      <div>
        <div class="text-sm font-medium" style="color:#1B4332">${esc(u.name || u.email)} ${u.role === "admin" ? `<span class="badge badge-gold">${t().admin_r}</span>` : ""}</div>
        <div class="text-xs" style="color:#8a8578">${esc(u.email || "")}</div>
      </div>
      <div class="flex items-center gap-2">
        <span class="badge ${u.active === false ? "badge-gray" : "badge-green"}">${u.active === false ? t().inactive : t().active}</span>
        <button data-edituser="${u.id}" class="btn btn-ghost" style="padding:4px 8px;font-size:12px">${icons.pencil}${t().edit}</button>
        <button data-toggleactive="${u.id}" class="btn btn-outline" style="padding:4px 8px;font-size:12px">${u.active === false ? t().activate : t().deactivate}</button>
      </div>
    </div>`).join("") || `<p class="text-xs" style="color:#8a8578">—</p>`;
  listEl.querySelectorAll("[data-edituser]").forEach(b => b.addEventListener("click", () => openEditUserModal(allUsers.find(u => u.id === b.getAttribute("data-edituser")))));
  listEl.querySelectorAll("[data-toggleactive]").forEach(b => b.addEventListener("click", async () => {
    const u = allUsers.find(x => x.id === b.getAttribute("data-toggleactive"));
    if (!u) return;
    await updateDoc(doc(db, "users", u.id), { active: u.active === false ? true : false });
  }));
}

function openAddUserModal() {
  openModal(t().addUser, `
    <div class="flex flex-col gap-4">
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().name}</span><input id="uName" class="inp" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().email}</span><input id="uEmail" type="email" class="inp" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().password}</span><input id="uPassword" type="password" class="inp" /></label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="uIsAdmin" /><span>${t().isAdminUser}</span></label>
      <div id="uPermsWrap">
        <div class="text-sm font-medium mb-2" style="color:#6B6659">${t().permissions}</div>
        <div id="uPerms">${permMatrixHtml({})}</div>
      </div>
      <div id="uErr" class="text-xs" style="color:#9B2C2C"></div>
      <div class="flex justify-end gap-2"><button id="cancelBtn" class="btn btn-outline">${t().cancel}</button><button id="saveBtn" class="btn btn-primary">${t().save}</button></div>
    </div>`, (wrap) => {
    wrap.querySelector("#uIsAdmin").addEventListener("change", (e) => { wrap.querySelector("#uPermsWrap").style.display = e.target.checked ? "none" : "block"; });
    wrap.querySelector("#cancelBtn").addEventListener("click", () => wrap.remove());
    wrap.querySelector("#saveBtn").addEventListener("click", async () => {
      const name = wrap.querySelector("#uName").value.trim();
      const email = wrap.querySelector("#uEmail").value.trim();
      const password = wrap.querySelector("#uPassword").value;
      const isAdminUser = wrap.querySelector("#uIsAdmin").checked;
      const errBox = wrap.querySelector("#uErr");
      if (!name || !email || password.length < 6) { errBox.textContent = t().userCreateError; return; }
      const permissions = isAdminUser ? {} : readPermMatrix(wrap);
      const secName = "secondary-" + Date.now();
      try {
        const secApp = initializeApp(firebaseConfig, secName);
        const secAuth = getAuth(secApp);
        const cred = await createUserWithEmailAndPassword(secAuth, email, password);
        const newUid = cred.user.uid;
        await signOut(secAuth);
        await deleteApp(secApp);
        await setDoc(doc(db, "users", newUid), { name, email, role: isAdminUser ? "admin" : "user", active: true, permissions, createdAt: serverTimestamp() });
        wrap.remove();
      } catch (e) { errBox.textContent = t().userCreateError; }
    });
  });
}
function openEditUserModal(user) {
  if (!user) return;
  const isAdminUser0 = user.role === "admin";
  openModal(t().editUser, `
    <div class="flex flex-col gap-4">
      <label class="flex flex-col gap-1 text-sm"><span class="font-medium" style="color:#6B6659">${t().name}</span><input id="uName" class="inp" value="${esc(user.name || "")}" /></label>
      <p class="text-xs" style="color:#8a8578">${esc(user.email || "")}</p>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="uIsAdmin" ${isAdminUser0 ? "checked" : ""} /><span>${t().isAdminUser}</span></label>
      <div id="uPermsWrap" style="${isAdminUser0 ? "display:none" : ""}">
        <div class="text-sm font-medium mb-2" style="color:#6B6659">${t().permissions}</div>
        <div id="uPerms">${permMatrixHtml(user.permissions)}</div>
      </div>
      <button id="resetBtn" class="btn btn-outline">${t().sendResetEmail}</button>
      <div id="uMsg" class="text-xs"></div>
      <div class="flex justify-end gap-2"><button id="cancelBtn" class="btn btn-outline">${t().cancel}</button><button id="saveBtn" class="btn btn-primary">${t().save}</button></div>
    </div>`, (wrap) => {
    wrap.querySelector("#uIsAdmin").addEventListener("change", (e) => { wrap.querySelector("#uPermsWrap").style.display = e.target.checked ? "none" : "block"; });
    wrap.querySelector("#cancelBtn").addEventListener("click", () => wrap.remove());
    wrap.querySelector("#resetBtn").addEventListener("click", async () => {
      const msg = wrap.querySelector("#uMsg");
      try { await sendPasswordResetEmail(auth, user.email); msg.style.color = "#1B4332"; msg.textContent = t().resetEmailSent; }
      catch (e) { msg.style.color = "#9B2C2C"; msg.textContent = t().passwordError; }
    });
    wrap.querySelector("#saveBtn").addEventListener("click", async () => {
      const name = wrap.querySelector("#uName").value.trim();
      const isAdminUser = wrap.querySelector("#uIsAdmin").checked;
      const permissions = isAdminUser ? {} : readPermMatrix(wrap);
      if (!name) return;
      await updateDoc(doc(db, "users", user.id), { name, role: isAdminUser ? "admin" : "user", permissions });
      wrap.remove();
    });
  });
}

// ---------------------------------------------------------------------------
// Firestore listeners
// ---------------------------------------------------------------------------
function repaintCurrentTab() {
  if (tab === "dashboard") paintDashboardCard();
  if (tab === "dataEntry") paintDataEntryBody();
  if (tab === "adminPanel" && isAdmin()) {
    paintAdminGrid(); paintCategoryGrid(); paintEventTypeGrid(); paintApprovalList(); paintUsersList();
  }
  document.querySelectorAll("[data-tenant-modal]").forEach(w => { const id = w.dataset.tenantModal; if (id) paintTenantDetailBody(id); });
  document.querySelectorAll("[data-event-modal]").forEach(w => { const id = w.dataset.eventModal; if (id) paintEventDetailBody(id); });
}

function startAllListeners() {
  if (unsubs.length) return;
  const bind = (name, target) => onSnapshot(collection(db, name), (snap) => {
    target.length = 0;
    snap.docs.forEach(d => target.push({ id: d.id, ...d.data() }));
    repaintCurrentTab();
  });
  unsubs.push(bind("units", units));
  unsubs.push(bind("subUnits", subUnits));
  unsubs.push(bind("users", allUsers));
  unsubs.push(bind("expenseCategories", expenseCategories));
  unsubs.push(bind("eventTypes", eventTypes));
  unsubs.push(bind("tenants", tenants));
  unsubs.push(bind("rentPayments", rentPayments));
  unsubs.push(bind("expenses", expenses));
  unsubs.push(bind("events", events));
  unsubs.push(bind("eventPayments", eventPayments));
  unsubs.push(bind("eventExpenses", eventExpenses));
  unsubs.push(bind("approvalRequests", approvalRequests));
  unsubs.push(onSnapshot(doc(db, "settings", "global"), (snap) => {
    globalSettings = { hijriOffsetDays: 0, ...(snap.exists() ? snap.data() : {}) };
    const bar = document.getElementById("dateBar");
    if (bar) bar.innerHTML = dateBarHtml();
    repaintCurrentTab();
  }));
  seedIfEmpty();
}
function stopAllListeners() {
  unsubs.forEach(u => u());
  unsubs = [];
  units.length = 0; subUnits.length = 0; allUsers.length = 0;
  expenseCategories.length = 0; eventTypes.length = 0;
  tenants.length = 0; rentPayments.length = 0; expenses.length = 0;
  events.length = 0; eventPayments.length = 0; eventExpenses.length = 0;
  approvalRequests.length = 0;
  globalSettings = { hijriOffsetDays: 0 };
}
async function seedIfEmpty() {
  if (!isAdmin()) return;
  const snap = await getDocs(collection(db, "units"));
  if (!snap.empty) return;
  const unitRef = await addDoc(collection(db, "units"), { name: "Green Park", createdAt: serverTimestamp() });
  for (const s of [{ name: "Event", billingType: "perEvent" }, { name: "Shop", billingType: "monthly" }, { name: "House", billingType: "monthly" }]) {
    await addDoc(collection(db, "subUnits"), { unitId: unitRef.id, name: s.name, billingType: s.billingType, createdAt: serverTimestamp() });
  }
}

onAuthStateChanged(auth, async (u) => {
  authChecked = true;
  currentUser = u || null;
  if (!u) { profile = null; profileChecked = true; stopAllListeners(); render(); return; }
  profileChecked = false; render();
  const snap = await getDoc(doc(db, "users", u.uid));
  profile = snap.exists() ? snap.data() : null;
  profileChecked = true;
  render();
  if (profile) startAllListeners();
});

setInterval(() => {
  const bar = document.getElementById("dateBar");
  if (bar) bar.innerHTML = dateBarHtml();
}, 30000);
</script>
